# Запускать из этой папки (ci-cd). name закреплён, чтобы volume'ы остались do-not-forget_* (база, сессии, сертификаты)
name: do-not-forget

services:
  app:
    # Контекст — корень do-not-forget: Dockerfile копирует backend/
    build:
      context: ..
      dockerfile: ci-cd/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ../frontend-web
    restart: unless-stopped
    environment:
      # Полный адрес сайта для sitemap.xml, например https://example.ru
      SITE_URL: ${SITE_URL:-}

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF: сессии пользователей переживают перезапуск контейнера
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Локально — просто :80 (http), на сервере — домен, Caddy сам выпустит HTTPS
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - web

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
